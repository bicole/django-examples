<!-- Navbar -->
<nav class="navbar navbar-expand-sm bg-light">
    <div class="container-fluid">
        <div class="h6 navbar-text justify-content-left">
            <div class="col">
            Hello,
            {% if user.is_authenticated %}
                {{ user.username }}!
                <form method="POST"
                    {% if user.is_superuser %}
                        action="{% url 'admin:logout' %}"
                    {% else %}
                        action="{% url 'logout' %}"
                    {% endif %}
                >
                    {% csrf_token %}
                    <input type="submit" value="Logout" />
                </form>
            {% else %}
                <a href="{% url 'login' %}">Guest</a>!
            {% endif %}
            </div>
        </div>
        <div class="navbar justify-content-center">
            <div class="navbar-text">IP: {{ request.META.HTTP_X_FORWARDED_FOR|default:request.META.REMOTE_ADDR }}</div>
        </div>
        <div class="navbar justify-content-right">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" title="View All Pages" href="{% url 'pages:index' %}">Pages</a>
                    </li>
                    {% if user.is_authenticated and user.is_superuser %}
                        <li class="nav-item justify-content-right">
                            <a class="nav-link" title="Open Admin Panel" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
            <a class="navbar-brand" title="Home" href="/">Logo</a>
        </div>
    </div>
  </nav>
